<style>
  :root {
    --teal: #14b8a6;
    --teal-focus: #1c7c7d;
    --paper: #f9fbfc;
    --card: #ffffff;
    --ink: #333333;
    --ink-soft: #555555;
    --ink-deep: #1e293b;
    --line: #b0bec5;
    --card-radius: 48px;
    --pill-radius: 32px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--paper); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Plus Jakarta Sans", sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--teal) 0%, var(--paper) 50%) fixed;
  }
  .page {
    padding: 88px 16px 96px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: var(--card-radius);
    padding: 48px;
    text-align: center;
  }
  h1 {
    margin: 0 0 32px;
    font-size: clamp(40px, 11vw, 60px);
    font-weight: 600;
    line-height: 1.125;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .label {
    margin: 32px 0;
    font-size: 26px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.03em;
    color: var(--ink-deep);
  }
  .lede {
    margin: 24px 0;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.375;
    color: var(--ink-soft);
  }
  p {
    margin: 24px 0;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.375;
  }
  .thumb {
    font-size: 0;
    color: transparent;
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #1f4d5c;
    object-fit: cover;
  }
  form { margin: 6px 0; }
  input[type="email"] {
    display: block;
    width: 100%;
    height: 56px;
    padding: 0 20px;
    font: 400 20px/54px "Plus Jakarta Sans", sans-serif;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--pill-radius);
    outline: none;
  }
  input[type="email"]::placeholder { color: var(--ink); opacity: .55; }
  input[type="email"]:focus, .consent input:focus + label::before {
    border-color: var(--teal-focus);
    box-shadow: 0 0 0 1px var(--teal-focus);
  }
  .consent {
    margin-top: 24px;
    display: flex;
    align-items: center;
    text-align: left;
  }
  .consent input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .consent label {
    display: flex;
    align-items: center;
    font-size: 14px;
    line-height: 1.25;
    cursor: pointer;
  }
  .consent label::before {
    content: "";
    flex: 0 0 42px;
    height: 42px;
    margin-right: 21px;
    background: #fff center / 23px auto no-repeat;
    border: 1px solid var(--line);
    border-radius: var(--pill-radius);
  }
  .consent input:checked + label::before {
    background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 648 552'%3E%3Cpath d='M225.3,517.7L2.1,293.1l68.1-67.7L226,382.3L578.1,35.6l67.4,68.4L225.3,517.7z' fill='%23333333'/%3E%3C/svg%3E");
  }
  .hp { position: absolute; left: -9999px; }
  button {
    display: block;
    width: 100%;
    margin-top: 24px;
    min-height: 40px;
    padding: 0 20px;
    font: 600 22px/40px "Plus Jakarta Sans", sans-serif;
    color: #fff;
    background: var(--teal);
    border: 0;
    border-radius: var(--pill-radius);
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--teal-focus); outline-offset: 3px; }
  .status { margin: 16px 0 0; font-size: 16px; font-weight: 400; }
  @media (max-width: 520px) {
    .page { padding: 16px 12px 48px; }
    .card { padding: 32px 24px; border-radius: 32px; }
    .label { font-size: 22px; }
    button { font-size: 18px; }
  }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; margin: 24px 0; background: #1f4d5c; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .linkbtn { display: block; width: 100%; margin-top: 24px; min-height: 40px; padding: 0 20px; font: 600 22px/40px "Plus Jakarta Sans", sans-serif; color: #fff; background: var(--teal); border-radius: var(--pill-radius); text-decoration: none; }
  .linkbtn:focus-visible { outline: 2px solid var(--teal-focus); outline-offset: 3px; }
  @media (max-width: 520px) { .linkbtn { font-size: 18px; } }
</style>

<body>
<main class="page">
  <div class="card">
    <h1>Check your email</h1>
    <p class="lede">Confirm your subscription to finish.</p>

    <div class="video">
      <iframe src="https://player.vimeo.com/video/1247657504?app_id=122963" title="Threshold | Subscription Confirmation" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <p>Open the confirmation email and click the link. If it isn't in your inbox, look in spam or promotions.</p>
    <p>In the meantime, this week's release is here.</p>
    <a class="linkbtn" href="https://heartbeat.workingfromtheheart.com/posts/there-are-no-mistakes">Watch This Week's Release</a>
    <p>Once you confirm, a new release arrives every Tuesday.</p>
